<script>
// Set the theme before the first paint so a saved dark theme never flashes light.
(() => {
  let theme;
  try { theme = JSON.parse(localStorage.getItem('al21.theme')); } catch {}
  document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
    ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
})();
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f3f3f0; --panel: #ffffff; --ink: #1b1b1d; --muted: #6b6b72; --line: #dddcd6;
  --banner: #101012; --logo: #ffffff;
  --accent: #2f62e0; --accent-ink: #ffffff; --accent-soft: #e6edff;
  --key: #fbfbf9; --key-edge: #cfcec7; --key-shadow: #b9b8b0;
  --ok: #19733a; --warn: #a24a00; --danger: #c22a2a; --status-green: #5cc483;
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #131315; --panel: #1c1c1f; --ink: #ececef; --muted: #9b9ba3; --line: #2d2d32;
    --accent: #7aa2ff; --accent-ink: #0d0d0f; --accent-soft: #1d2846;
    --key: #26262a; --key-edge: #3a3a40; --key-shadow: #0b0b0c;
    --ok: #5cc483; --warn: #f0a35e; --danger: #ff7272;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-gutter: stable; }
@supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.key-assignment { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 12px; }
.key-assignment select { width: 100%; min-width: 0; }
.key-assignment > .primary { white-space: nowrap; }
.key-capture { min-width: 0; display: flex; align-items: center; padding: 7px 0; color: var(--accent); cursor: default; }
.key-capture.sel { animation: capture-hint-pulse 2.4s ease-in-out infinite; }
.capture-dots { display: inline-block; width: 1em; text-align: left; }
.capture-dots::after { content: '...'; }
.key-capture.sel .capture-dots::after { animation: capture-dots 2.4s step-end infinite; }
.capture-hint { margin: 0 0 12px; }
@keyframes capture-hint-pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes capture-dots { 0%, 100% { content: '.'; } 33.333% { content: '..'; } 66.666% { content: '...'; } }
@media (prefers-reduced-motion: reduce) {
  .key-capture.sel, .key-capture.sel .capture-dots::after { animation: none; }
  .capture-dots::after { content: '...'; }
}
button.danger { color: var(--danger); }
select, input[type=number], input[type=text] { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }

header {
  color-scheme: dark;
  --bg: #131315; --panel: #1c1c1f; --ink: #ececef; --muted: #9b9ba3; --line: #2d2d32;
  --accent: #7aa2ff; --accent-ink: #0d0d0f; --ok: #5cc483; --warn: #f0a35e;
  display: flex; align-items: center; gap: 16px; padding: 14px 24px;
  border-bottom: 1px solid var(--line); background: var(--banner); color: var(--ink);
}
header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
header h1.logo { line-height: 0; }
header h1.logo svg { height: 40px; width: auto; display: block; color: var(--logo); }
header .spacer { flex: 1; }
.connection-info { display: inline-flex; align-items: center; gap: 8px; }
.connection-info .pill { padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); white-space: nowrap; }
.settings-trigger { display: grid; place-items: center; width: 34px; height: 34px; padding: 7px; flex: none; color: var(--muted); background: transparent; }
.settings-trigger:hover { color: var(--ink); }
.settings-trigger svg { width: 19px; height: 19px; }
.theme-switch { display: inline-flex; gap: 4px; flex: none; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
.theme-switch button { display: grid; place-items: center; width: 32px; height: 32px; padding: 6px; border: 1px solid transparent; border-radius: 50%; background: transparent; color: var(--muted); }
.theme-switch button[aria-pressed="true"] { background: var(--panel); border-color: var(--line); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.theme-switch button:hover { color: var(--ink); }
.theme-switch svg { width: 18px; height: 18px; }
@media (max-width: 760px) {
  header { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
  header h1.logo { flex: 1 1 calc(100% - 90px); order: -2; }
  header h1.logo svg { max-width: 100%; height: auto; width: 280px; }
  header .theme-switch { order: -1; }
  header .spacer { display: none; }
}
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); font-size: 13px; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.on .dot { background: var(--status-green); }
.pill.sleep .dot { background: var(--warn); }

main { display: grid; grid-template-columns: 480px minmax(340px, 1fr); align-items: start; gap: 24px; padding: 24px; max-width: 1200px; margin: 0 auto; }
main > .card:first-child { position: sticky; top: 24px; }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.advanced-popup { width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); margin: auto; padding: 22px; overflow-y: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--ink); box-shadow: 0 20px 70px rgb(0 0 0 / .3); }
.advanced-popup::backdrop { background: rgb(0 0 0 / .45); backdrop-filter: blur(3px); }
.advanced-popup-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.advanced-popup-head h2 { margin: 0; font-size: 17px; }
.advanced-close { display: grid; place-items: center; width: 30px; height: 30px; padding: 5px; border: 0; background: transparent; color: var(--muted); }
.advanced-close:hover { color: var(--ink); background: var(--bg); }
.advanced-close svg { width: 18px; height: 18px; }
.advanced-body { padding-top: 18px; }
.advanced-intro { margin: 0 0 18px; }
.advanced-controls { border: 0; padding: 0; margin: 0; min-width: 0; }
.advanced-controls h3 { margin: 0; font-size: 14px; }
.advanced-debounce { margin-top: 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 10px; }
.advanced-debounce input { width: 100%; min-width: 0; accent-color: var(--accent); }
.advanced-debounce output { min-width: 32px; padding: 3px 8px; text-align: center; background: var(--accent-soft); color: var(--accent); border-radius: 6px; font-variant-numeric: tabular-nums; }
.advanced-sleep { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.advanced-sleep > .hint { margin: 5px 0 14px; }
.advanced-setting { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 12px 0; }
.advanced-setting > span:first-child { flex: 1; }
.advanced-setting strong, .advanced-setting small { display: block; }
.advanced-setting strong { font-weight: 500; }
.advanced-setting small { color: var(--muted); margin-top: 2px; }
.advanced-minutes { display: flex; flex: none; align-items: center; gap: 7px; }
.advanced-minutes input { width: 88px; font-variant-numeric: tabular-nums; }
.advanced-minutes input[aria-invalid="true"] { border-color: var(--danger); }
.advanced-actions { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
.advanced-error { color: var(--danger); margin: 0 0 14px; }

.layers { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: nowrap; overflow-x: auto; }
.layers button { border-radius: 999px; font-weight: 400; white-space: nowrap; flex: none; }
.layers button.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.layers .active-mark { color: #43a96a; margin-left: 4px; }
.layer-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; color: var(--muted); font-size: 13px; height: 40px; }
.profile-action { display: flex; align-items: center; flex: none; white-space: nowrap; }
.layer-bar input.profile-name { flex: 1; width: 0; min-width: 0; padding: 6px 10px; font: inherit; color: var(--ink); }

.pad { position: relative; margin: 0 auto; }
.key { position: absolute; border: 1px solid var(--key-edge); border-radius: 9px; background: var(--key); box-shadow: 0 2px 0 var(--key-shadow);
  padding: 5px 6px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; overflow: hidden; }
.key .legend { font-size: 11px; color: var(--muted); }
.key .assign { font-size: 12.5px; font-weight: 600; line-height: 1.15; word-break: break-word; }
.key.changed { background: var(--accent-soft); }
.key.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.key.fn-held, .key.sel.capture-listening { transform: translateY(2px); box-shadow: inset 0 2px 4px rgb(0 0 0 / .18); }
.key.sel.capture-listening { outline: none; border: 2px solid var(--accent); padding: 4px 5px; background: var(--accent-soft); color: var(--ink); opacity: 1; animation: keycap-capture-pulse 2.4s ease-in-out infinite; }
.key.capture-listening .legend { color: var(--ink); }
@keyframes keycap-capture-pulse {
  0%, 100% { background: color-mix(in srgb, var(--accent-soft) 60%, var(--panel)); }
  50% { background: color-mix(in srgb, var(--accent) 25%, var(--accent-soft)); }
}
.key.empty .assign { color: var(--muted); font-weight: 400; }
.key.fn-held { background: var(--bg); color: var(--muted); opacity: .65; }
.knob { position: absolute; border-radius: 50%; border: 1px solid var(--key-edge); background: radial-gradient(circle at 40% 35%, var(--key), var(--bg)); box-shadow: 0 2px 0 var(--key-shadow); display: flex; overflow: hidden; }
.knob button { flex: 1; border: none; border-radius: 0; background: transparent; padding: 0; font-size: 15px; color: var(--muted); }
.knob button + button { border-left: 1px dashed var(--key-edge); }
.knob button:hover:not(:disabled) { border-color: var(--key-edge); }
.knob button.sel { color: var(--accent); }
.knob button.changed { color: var(--accent); }
.knob button.fn-held { background: var(--bg); color: var(--muted); box-shadow: inset 0 2px 4px rgb(0 0 0 / .18); opacity: .65; }
.knob-selection { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.knob-selection path { fill: none; stroke: var(--accent); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; opacity: 0; }
.knob-selection path.sel { opacity: 1; stroke-width: 2; }
.knob.capture-listening > button.sel { background: var(--accent-soft); box-shadow: inset 0 2px 4px rgb(0 0 0 / .18); animation: keycap-capture-pulse 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .key.sel.capture-listening, .knob.capture-listening > button.sel { animation: none; }
}
.knob:has(> button:nth-child(1):hover:not(:disabled)) .knob-selection path:nth-child(1),
.knob:has(> button:nth-child(2):hover:not(:disabled)) .knob-selection path:nth-child(2),
.knob:has(> button:nth-child(3):hover:not(:disabled)) .knob-selection path:nth-child(3) { opacity: 1; }
.knob-legend { margin-top: 37px; font-size: 13px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.knob-legend b { color: var(--ink); font-weight: 600; }

.editor h2 { font-size: 16px; margin: 0 0 2px; }
.editor .current { color: var(--muted); margin-bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; overflow-wrap: anywhere; }
.editor .current-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-width: 0; }
.editor .current .code { flex: none; white-space: nowrap; font: 12px/1.4 ui-monospace, Consolas, monospace; padding: 3px 8px; border-radius: 6px; background: var(--bg); }
button.link { border: none; background: none; padding: 0 4px; color: var(--accent); }
button.link:hover { text-decoration: underline; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); }
.tabs button.sel { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.grid-btns { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin-bottom: 14px; }
.grid-btns.effects { margin-bottom: 28px; }
.grid-btns.effect-modes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.grid-btns.effect-modes button { padding: 12px; flex-direction: column; align-items: flex-start; border-radius: 10px; }
.effect-modes .ico { margin-top: 2px; flex: none; }
.effect-mode-copy { display: flex; flex-direction: column; gap: 3px; }
.effect-mode-copy strong { font-weight: 600; }
.effect-mode-copy .hint { font-weight: 400; }
@media (max-width: 420px) { .grid-btns.effect-modes { grid-template-columns: 1fr; } }
.group-title.color-title { margin-top: 26px; }
.lighting-controls { min-width: 0; margin: 0; padding: 0; border: 0; }
.effect-heading { display: flex; align-items: center; justify-content: space-between; min-height: 18px; gap: 12px; }
.light-progress { display: inline-flex; align-items: center; gap: 6px; min-height: 18px; text-transform: none; letter-spacing: normal; }
.light-progress:not(:empty)::before { content: ''; width: 10px; height: 10px; border: 2px solid var(--muted); border-right-color: transparent; border-radius: 50%; animation: light-spin .7s linear infinite; }
@keyframes light-spin { to { transform: rotate(360deg); } }
.grid-btns button { text-align: left; display: flex; align-items: center; gap: 8px; }
.grid-btns button.wide { grid-column: span 2; }
.ico { width: 18px; height: 18px; flex: none; }
.ico .f { fill: currentColor; stroke: none; }
.grid-btns .ico { color: var(--accent); }
.grid-btns .ico.bamboo { width: 16px; height: 22px; }
.key .top { display: flex; justify-content: space-between; align-items: flex-start; }
.key .top .ico { width: 18px; height: 18px; color: var(--accent); }
.knob-legend b, .with-ico { display: inline-flex; align-items: center; gap: 6px; }
.knob-legend .ico, .with-ico .ico { width: 16px; height: 16px; }
.group-title { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 10px 0 6px; }
.hint { color: var(--muted); font-size: 13px; }
.empty-state { color: var(--muted); padding: 40px 0; text-align: center; }

.macro-list { border: 1px solid var(--line); border-radius: 10px; max-height: 260px; overflow: auto; scrollbar-gutter: stable; margin-bottom: 12px; }
.macro-list table { width: 100%; border-collapse: collapse; }
.macro-list td { padding: 4px 8px; border-bottom: 1px solid var(--line); }
.macro-list tr:last-child td { border-bottom: none; }
.macro-list input { width: 76px; }
.macro-list .x { border: none; padding: 2px 6px; color: var(--muted); }
.rec { color: var(--danger); font-weight: 600; }
.bytes { font-size: 12px; color: var(--muted); }

#log { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; max-width: 380px; z-index: 10; }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 14px; box-shadow: 0 6px 24px rgb(0 0 0 / .12); }
.toast.err { border-left-color: var(--danger); }
.toast.ok { border-left-color: var(--ok); }
.busy { position: fixed; inset: 0; background: rgb(0 0 0 / .18); display: none; align-items: center; justify-content: center; z-index: 9; }
.busy.show { display: flex; }
.busy div { background: var(--panel); padding: 16px 22px; border-radius: 12px; border: 1px solid var(--line); }
.unsupported { max-width: 640px; margin: 80px auto; }
.layers .light-tab { display: inline-flex; align-items: center; gap: 6px; }
.layers .light-tab .ico { width: 16px; height: 16px; }
.grid-btns button.sel, .seg button.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.row > .slider-label { width: 84px; color: var(--muted); }
.slider input[type=range] { flex: 1; max-width: 260px; accent-color: var(--accent); }
.slider-val { width: 40px; color: var(--muted); font-size: 13px; }
.swatches { display: grid; grid-template-columns: max-content 1px minmax(0, 1fr); align-items: start; gap: 12px; margin-bottom: 14px; }
.default-swatches { display: grid; grid-template-columns: repeat(8, 30px); gap: 8px; }
.custom-swatches { display: flex; flex-wrap: wrap; align-items: center; align-content: start; gap: 8px; min-width: 0; }
.swatch { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.swatch.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.swatch.off { background: repeating-linear-gradient(45deg, var(--panel) 0 4px, var(--line) 4px 8px) !important; }
.swatch-divider { width: 1px; min-height: 30px; height: 100%; background: var(--line); }
.saved-colour-wrap { display: inline-flex; position: relative; width: 30px; height: 30px; flex: none; }
.delete-colour { position: absolute; right: -6px; bottom: -5px; display: grid; place-items: center; width: 18px; height: 18px; padding: 2px; border-radius: 50%; background: var(--panel); color: var(--danger); }
.delete-colour:hover:not(:disabled) { border-color: var(--danger); }
.delete-colour .ico { width: 12px; height: 12px; }
.save-colour { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 1px dashed var(--line); border-radius: 50%; background: transparent; color: var(--muted); }
.save-colour:hover:not(:disabled) { color: var(--accent); }
.save-colour .ico { width: 16px; height: 16px; }
@media (max-width: 520px) {
  .default-swatches { grid-template-columns: repeat(8, 26px); gap: 6px; }
  .default-swatches .swatch { width: 26px; height: 26px; }
}
.colour-editor { position: fixed; z-index: 20; width: 280px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow: auto; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); box-shadow: 0 12px 40px rgb(0 0 0 / .2); opacity: 0; transform: scale(.84); }
.colour-editor.open { animation: colour-grow 220ms cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes colour-grow { from { opacity: 0; transform: scale(.84); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .colour-editor.open { animation-duration: 1ms; } }
.colour-editor-head, .colour-editor-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.colour-editor-head { margin-bottom: 12px; }
.colour-editor-head strong { font-size: 14px; font-weight: 600; }
.colour-editor-close { display: grid; place-items: center; width: 26px; height: 26px; padding: 4px; border: none; background: transparent; color: var(--muted); }
.colour-editor-close:hover { color: var(--ink); }
.colour-editor-close .ico { width: 16px; height: 16px; }
.colour-plane { position: relative; height: 148px; border-radius: 9px; background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(var(--hue) 100% 50%)); touch-action: none; cursor: crosshair; }
.colour-plane:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.colour-point { position: absolute; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px rgb(0 0 0 / .5); transform: translate(-50%, -50%); pointer-events: none; }
.colour-hue { display: block; appearance: none; width: 100%; height: 12px; margin: 16px 0; border-radius: 999px; background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); cursor: pointer; }
.colour-hue::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; border: 2px solid var(--panel); border-radius: 50%; background: hsl(var(--hue) 100% 50%); box-shadow: 0 0 0 1px var(--muted); }
.colour-hex { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
.colour-hex input { flex: 1; min-width: 0; font: 13px ui-monospace, Consolas, monospace; }
.colour-hex input[aria-invalid="true"] { border-color: var(--danger); }
.colour-editor-delete { display: inline-flex; align-items: center; gap: 5px; padding: 5px 0; border: none; background: transparent; color: var(--danger); }
.colour-editor-delete .ico { width: 16px; height: 16px; }
.key.paint { box-shadow: 0 2px 0 var(--key-shadow), inset 0 0 0 1px rgb(0 0 0 / .15); }
.key.paint .legend { color: inherit; opacity: .75; }
.key.paint.unlit { background: var(--key) !important; color: var(--muted) !important; }
.key.rainbow::before { content: ''; position: absolute; inset: 0; border-radius: 8px; padding: 2px; background: linear-gradient(135deg, #f44, #fb0, #4d4, #2cf, #66f, #e4e); mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude; pointer-events: none; }
.knob.dim { opacity: .45; }
.button-like { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
.button-like:hover { border-color: var(--accent); }
</style>
</head>

// ---------------------------------------------------------------------------
// Protocol (reverse-engineered from YUNZII Driver 3.2.22, verified on an AL21)
// ---------------------------------------------------------------------------
const VID = 0x3151, DONGLE_PID = 0x5052, WIRED_PID = 0x5056, AL21_ID = 4047;
const PROFILES = 3, PAGES = 4; // 4 pages x 64 bytes = slots 0..63, enough for the AL21
const MACRO_SLOTS = 50, MACRO_BYTES = 256;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const eq = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
const hex = (a) => [...a].map((b) => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');

// Sleep times are unsigned 16-bit seconds. The fourth field is not exposed for
// AL21 in the vendor UI, but must be preserved whenever the other timers change.
const SLEEP_OFFSETS = { time_bt: 8, time_24: 10, deepTime_bt: 12, deepTime_24: 14 };
function parseSleepTimes(reply) {
  if (reply.length < 16 || reply[0] !== 0x91) throw new Error('Could not read sleep times from the numpad.');

}
function sleepTimesFrame(settings) {
  const frame = new Uint8Array(64);
  frame[0] = 0x11;
  for (const [key, offset] of Object.entries(SLEEP_OFFSETS)) {

    if (!Number.isInteger(seconds) || seconds < 0 || seconds > 65535) throw new Error('Invalid sleep time.');

    const b = new Uint8Array(64);

    h('div', { class: 'default-swatches' }, colors.map((c, i) => h('button', {
      class: 'swatch' + (isSelected('default', i) ? ' sel' : '') + (c ? '' : ' off'),

          style: { background: toHexColor(c) }, title: 'Saved colour ' + toHexColor(c) + ' - Click again to edit - Delete to remove',
          ariaLabel: 'Saved colour ' + toHexColor(c), ariaPressed: String(isSelected('saved', i)),

        }),
        h('button', { class: 'delete-colour', title: 'Delete colour', ariaLabel: 'Delete saved colour ' + toHexColor(c), hidden: !isSelected('saved', i), onclick: () => remove(i) }, icon('trash')))),
      h('button', { class: 'save-colour', title: 'Create colour from selection', ariaLabel: 'Create colour from selection', onclick: () => {
        const palette = savedColors();
        store.set('al21.savedColors', [...palette, selected]);
        colorSelections[context] = { kind: 'saved', index: palette.length, color: selected };
        const next = swatchRow(selected, pick, withOff);

}

function slider(label, value, onchange) {

}

function lightEditor() {

    if (painting()) {

        swatchRow(state.paintColor, (c) => { state.paintColor = c; renderEditor(); }, true),

        h('div', { class: 'group-title' }, 'Import / export'),
        h('div', { class: 'row' },
          h('label', { class: 'button-like' }, h('input', { type: 'file', accept: 'image/*', hidden: true, onchange: (ev) => { const f = ev.target.files[0]; ev.target.value = ''; if (f) importPattern(f); } }), 'Import image…'),
          h('button', { onclick: exportPattern }, 'Export as image')),
        h('p', { class: 'hint' }, 'Export gives a PNG shaped like the numpad (also usable as a blank template). Colour the key blocks in any image editor and import it again. Any image works; each key takes the average colour of its area, transparent counts as off.'),

// A key plus up to two modifiers is stored as [0, a, b, c] using HID usages,
// e.g. Win+D = [0,0,Win,D], Ctrl+Shift+Esc = [0,Ctrl,Shift,Esc].
const MOD_FLAGS = [[224, 'ctrlKey'], [225, 'shiftKey'], [226, 'altKey'], [227, 'metaKey']];
let capturing = null;
let captureCleanup = null;
let startKeyCapture = null;
function stopKeyCapture() {
  if (capturing) window.removeEventListener('keydown', capturing, true);
  capturing = null;
  document.querySelectorAll('#pad .capture-listening').forEach((el) => el.classList.remove('capture-listening'));
  $('editor').querySelector('.key-capture')?.classList.remove('sel');
  captureCleanup?.();
  captureCleanup = null;
  startKeyCapture = null;
}
function keyTab(v) {
  if (!state.keyDraft) {
    const parts = v[0] === 0 ? [v[1], v[2], v[3]].filter(Boolean) : [];
    const key = parts.at(-1) ?? 0;
    state.keyDraft = { key, mods: new Set(parts.slice(0, -1).filter((p) => p >= 224 && p <= 227)) };
  }
  const d = state.keyDraft;
  const saveDraft = () => {
    if (!d.key) return toast('Choose a key first.', 'err');
    const m = [...d.mods].filter((x) => x !== d.key);
    if (m.length > 2) return toast('At most two modifiers can be combined with a key.', 'err');
    return assign(m.length === 0 ? [0, 0, d.key, 0] : m.length === 1 ? [0, 0, m[0], d.key] : [0, m[0], m[1], d.key]);
  };
  const save = h('button', {
    class: 'primary', disabled: !d.key, onclick: saveDraft,
  }, 'Save to Numpad');
  const sel = h('select', { ariaLabel: 'Key', onchange: () => {
    stopKeyCapture();
    d.key = Number(sel.value);
    save.disabled = !d.key;
  } }, h('option', { value: 0 }, 'Choose a key…'),
    [...new Set(KEYS.map((k) => k.group))].map((g) => h('optgroup', { label: g }, KEYS.filter((k) => k.group === g).map((k) => h('option', { value: k.hid, selected: k.hid === d.key }, k.label)))));
  const boxes = MODS.map(([hid, name]) => h('label', {}, h('input', { type: 'checkbox', checked: d.mods.has(hid), onchange: (e) => (e.target.checked ? d.mods.add(hid) : d.mods.delete(hid)) }), ` ${name}`));
  const hint = h('p', { class: 'hint capture-hint', hidden: true }, 'Press a key or shortcut. (e.g. Shift + Ctrl + T)');
  const capture = h('span', {
    class: 'key-capture', hidden: true, role: 'status', ariaLabel: 'Press a key or shortcut.',
  }, 'Press a key', h('span', { class: 'capture-dots', ariaHidden: 'true' }));
  startKeyCapture = () => {
      if (capturing) return;
      if (recording) {
        window.removeEventListener('keydown', recording, true);
        window.removeEventListener('keyup', recording, true);
        recording = null;
      }
      capture.classList.add('sel');
      sel.hidden = true;
      capture.hidden = false;
      hint.hidden = false;
      captureCleanup = () => {
        sel.hidden = false;
        capture.hidden = true;
        hint.hidden = true;
        save.disabled = !d.key;
      };
      $('pad').querySelector('.key.sel')?.classList.add('capture-listening');
      if (KNOB.includes(state.sel)) $('pad').querySelector('.knob')?.classList.add('capture-listening');
      save.disabled = true;
      // Modifier keys alone are skipped so shortcuts like Ctrl+Shift+T can be captured in one go.
      capturing = (e) => {
        e.preventDefault();
        const k = KEY_BY_CODE.get(e.code);
        if (!k || (k.hid >= 224 && k.hid <= 227)) return;
        stopKeyCapture();
        d.key = k.hid;
        d.mods = new Set(MOD_FLAGS.filter(([, f]) => e[f]).map(([hid]) => hid));
        renderEditor();
        saveDraft();
      };
      window.addEventListener('keydown', capturing, true);
  };
  const def = defaultFor(state.layer, state.sel.slot);
  return h('div', {},
    h('div', { class: 'key-assignment' }, sel, capture, save),
    h('div', { class: 'row' }, h('span', { class: 'hint' }, 'Hold with:'), boxes),
    hint,
    !eq(v, def) ? h('div', { class: 'row' }, h('button', { onclick: () => { stopKeyCapture(); assign(def); } }, 'Reset to default')) : null);
}

function mediaTab() {
  return h('div', {}, [...new Set(FUNCTIONS.map((f) => f.group))].map((g) => [
    h('div', { class: 'group-title' }, g),
    h('div', { class: 'grid-btns' }, FUNCTIONS.filter((f) => f.group === g).map((f) => h('button', { class: eq(f.v, [10, 14, 0, 0]) ? 'wide' : '', title: `Code ${hex(f.v)}`, onclick: () => assign(f.v) }, icon(eq(f.v, [10, 1, 0, 0]) ? 'bamboo' : f.icon), builtinName(f.v)))),
  ]));
}
function mouseTab() {
  return h('div', {}, h('div', { class: 'grid-btns' }, MOUSE.map((m) => h('button', { title: `Code ${hex(m.v)}`, onclick: () => assign(m.v) }, icon(m.icon), builtinName(m.v)))));
}
function otherTab(v) {
  const def = defaultFor(state.layer, state.sel.slot);
  return h('div', {},
    h('p', {}, 'Factory default: ', h('b', {}, labelOf(def, state.layer))),
    h('div', { class: 'row' },
      h('button', { disabled: eq(v, def), onclick: () => assign(def) }, 'Reset to default'),
      h('button', { class: 'danger', disabled: v.every((b) => !b), onclick: () => assign([0, 0, 0, 0]) }, state.layer === 'fn' ? 'Clear' : 'Disable key')));
}

// --- Macro editor ----------------------------------------------------------
let recording = null;
function macroTab(v) {
  const used = usedMacroSlots();
  if (!state.macroDraft) {
    state.macroDraft = { slot: v[0] === 9 ? v[2] : null, mode: v[0] === 9 ? v[1] : 0, repeat: 1, events: [], loaded: false, name: v[0] === 9 ? macroName(v[2]) : '' };
    if (v[0] === 9) loadMacroInto(v[2]);
  }
  const d = state.macroDraft;
  const slotSel = h('select', { onchange: () => { const s = slotSel.value === 'new' ? null : Number(slotSel.value); state.macroDraft = { slot: s, mode: d.mode, repeat: 1, events: [], name: s == null ? '' : macroName(s) }; if (s != null) loadMacroInto(s); else renderEditor(); } },
    h('option', { value: 'new', selected: d.slot == null }, 'New macro'),
    [...used].sort((a, b) => a - b).map((s) => h('option', { value: s, selected: d.slot === s }, macroName(s))));
  const rows = d.events.map((e, i) => h('tr', {},
    h('td', {}, e.raw ? 'Mouse move' : `${KEY_BY_HID.get(e.code)?.label ?? MOUSE_CODES[e.code] ?? '0x' + e.code.toString(16)} ${e.down ? '↓' : '↑'}`),
    h('td', {}, h('input', { type: 'number', min: 1, max: 65535, value: e.delay, onchange: (ev) => { e.delay = Math.max(1, Number(ev.target.value) || 1); renderEditor(); } }), ' ms'),
    h('td', {}, h('button', { class: 'x', title: 'Remove', onclick: () => { d.events.splice(i, 1); renderEditor(); } }, '✕'))));
  const len = macroLength(d.events);
  const recBtn = h('button', { class: recording ? 'rec' : '', onclick: toggleRecord }, recording ? '■ Stop recording' : '● Record');
  const addSel = h('select', {}, h('option', { value: '' }, 'Add step…'),
    h('optgroup', { label: 'Mouse' }, Object.entries(MOUSE_CODES).map(([c, n]) => h('option', { value: 'm' + c }, `${n} (press + release)`))),
    [...new Set(KEYS.map((k) => k.group))].map((g) => h('optgroup', { label: g }, KEYS.filter((k) => k.group === g).map((k) => h('option', { value: 'k' + k.hid }, `${k.label} (press + release)`)))));
  addSel.onchange = () => {
    const code = Number(addSel.value.slice(1));
    if (code) d.events.push({ code, down: true, delay: 20 }, { code, down: false, delay: 20 });
    renderEditor();
  };
  const fixed = h('input', { type: 'number', min: 1, value: 20, style: { width: '76px' } });
  return h('div', {},
    h('div', { class: 'row' }, slotSel, h('input', { type: 'text', placeholder: 'Name', value: d.name, oninput: (e) => (d.name = e.target.value) })),
    h('div', { class: 'row' }, recBtn, addSel, h('button', { disabled: !d.events.length, onclick: () => { d.events = []; renderEditor(); } }, 'Clear')),
    recording ? h('p', { class: 'hint' }, 'Type the keystrokes now. Timing between keys is recorded. Click Stop when done.') : null,
    d.events.length ? h('div', { class: 'macro-list' }, h('table', {}, rows)) : h('p', { class: 'hint' }, d.slot != null && !d.loaded ? 'Loading macro…' : 'No steps yet. Record keystrokes or add steps.'),
    h('div', { class: 'row' }, h('span', { class: 'hint' }, 'Set every delay to'), fixed, h('span', { class: 'hint' }, 'ms'),
      h('button', { disabled: !d.events.length, onclick: () => { d.events.forEach((e) => (e.delay = Math.max(1, Number(fixed.value) || 1))); renderEditor(); } }, 'Apply')),
    h('div', { class: 'row' },
      h('select', { onchange: (e) => { d.mode = Number(e.target.value); renderEditor(); } }, MACRO_MODES.map(([m, t]) => h('option', { value: m, selected: d.mode === m }, t))),
      d.mode === 0 ? [h('input', { type: 'number', min: 1, max: 65535, value: d.repeat, style: { width: '76px' }, onchange: (e) => (d.repeat = Math.max(1, Number(e.target.value) || 1)) }), h('span', { class: 'hint' }, 'times')] : null),
    h('div', { class: 'row' },
      h('button', { class: 'primary', disabled: !d.events.length || len > MACRO_BYTES - 4, onclick: saveMacro }, 'Save macro to this key'),
      h('span', { class: `bytes` }, `${len} / ${MACRO_BYTES - 4} bytes`)),
    d.slot != null && macroUsers(d.slot).some(([l, s]) => l !== state.layer || s !== state.sel.slot)
      ? h('p', { class: 'hint' }, 'This macro is also used by other keys; saving changes it for them too.') : null);
}
const macroUsers = (slot) => layers().flatMap((l) => [...Array(64).keys()].filter((s) => { const x = slotValue(l, s); return x[0] === 9 && x[2] === slot; }).map((s) => [l, s]));
async function loadMacroInto(slot) {
  await busy('Reading macro…', async () => {
    const m = decodeMacro(await state.kb.readMacro(slot));
    if (state.macroDraft?.slot !== slot) return;
    Object.assign(state.macroDraft, { events: m.events, repeat: Math.max(1, m.repeat), loaded: true });
  });
  renderEditor();
}
function toggleRecord() {
  if (recording) {
    window.removeEventListener('keydown', recording, true);
    window.removeEventListener('keyup', recording, true);
    recording = null;
    renderEditor();
    return;
  }
  const d = state.macroDraft;
  let last = null;
  recording = (e) => {
    if (e.repeat) { e.preventDefault(); return; }
    const k = KEY_BY_CODE.get(e.code);
    if (!k) return;
    e.preventDefault();
    const now = performance.now();
    if (last) last.delay = Math.max(1, Math.min(65535, Math.round(now - last.t)));
    last = { code: k.hid, down: e.type === 'keydown', delay: 20, t: now };
    d.events.push(last);
    renderEditor();
  };
  window.addEventListener('keydown', recording, true);
  window.addEventListener('keyup', recording, true);
  renderEditor();
}
function saveMacro() {
  const d = state.macroDraft;
  if (recording) toggleRecord();
  const used = usedMacroSlots();
  let slot = d.slot;
  if (slot == null) {
    // New macro: take the lowest slot no key references (same rule as the official driver).
    slot =[...Array(MACRO_SLOTS).keys()].find((s) => !used.has(s));
    if (slot == null) return toast('All 50 macro slots are in use.', 'err');
  }
  const buf = (() => { try { return encodeMacro(d.events.filter((e) => !e.raw), d.mode === 0 ? d.repeat : 1); } catch (e) { toast(e.message, 'err'); } })();
  if (!buf) return;
  return busy('Saving macro…', async () => {
    await state.kb.writeMacro(slot, buf);
    const back = await state.kb.readMacro(slot);
    const n = macroLength(d.events.filter((e) => !e.raw));
    if (!eq(back.slice(0, n), buf.slice(0, n))) throw new Error('The numpad did not store the macro correctly.');
    const names = macroNames();
    names[slot] = d.name.trim() || names[slot] || `Macro ${slot + 1}`;
    store.set('al21.macroNames', names);
    const value = [9, d.mode, slot, 0];
    if (await writeSlot(state.layer, state.sel.slot, value)) toast(`${keyTitle(state.sel)} → ${macroName(slot)}`, 'ok');
    state.macroDraft = null;
    render();
  });
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
const advancedDialog = $('advanced');
$('advancedOpen').onclick = () => {
  if (capturing) stopKeyCapture();
  if (recording) toggleRecord();
  closeColourEditor(false);
  renderAdvancedSettings();
  if (!advancedDialog.open) advancedDialog.showModal();
};
$('advancedClose').onclick = () => advancedDialog.close();
const outsideAdvancedDialog = ev => {
  const rect = advancedDialog.getBoundingClientRect();
  return ev.target === advancedDialog && (ev.clientX < rect.left || ev.clientX > rect.right || ev.clientY < rect.top || ev.clientY > rect.bottom);
};
let advancedBackdropPressed = false;
advancedDialog.addEventListener('pointerdown', ev => { advancedBackdropPressed = outsideAdvancedDialog(ev); });
advancedDialog.addEventListener('click', ev => {
  if (advancedBackdropPressed && outsideAdvancedDialog(ev)) advancedDialog.close();
  advancedBackdropPressed = false;
});
if (!('hid' in navigator)) {
  $('app').replaceChildren(h('div', { class: 'card unsupported' },
    h('h2', {}, 'This browser cannot talk to USB devices'),
    h('p', {}, 'Open AL21 Studio in Google Chrome or Microsoft Edge. If you opened the file directly, run "node serve.js" in this folder and visit the address it prints.')));
  $('connect').disabled = true;
} else {
  const stopRecordingForSettings = () => {
    if (capturing) stopKeyCapture();
    if (recording) toggleRecord();
  };
  $('advanced').addEventListener('pointerdown', stopRecordingForSettings);
  $('advanced').addEventListener('focusin', stopRecordingForSettings);
  $('connect').onclick = async () => {
    try {
      const picked = await navigator.hid.requestDevice({ filters: FILTERS });
      const dev = picked.find(isVendorIface);
      if (dev) await connect(dev);
    } catch (e) { toast(e.message, 'err'); }
  };
  $('reload').onclick = () => busy('Reading the numpad…', loadAll);
  navigator.hid.getDevices().then((ds) => { const d = ds.find(isVendorIface); if (d) connect(d).catch((e) => toast(e.message, 'err')); });
  render();
}
