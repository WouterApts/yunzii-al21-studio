<script>
// Set the theme before the first paint so a saved dark theme never flashes light.
(() => {
  let theme;
  try { theme = JSON.parse(localStorage.getItem('al21.theme')); } catch {}
  document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
    ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
})();
</script>

:root {
  color-scheme: light;
  /* One warm-neutral family (panda black and white) plus one bamboo-green accent. */
  --bg: #ecebe6; --panel: #fafaf7; --ink: #1b1b19; --muted: #65645e; --line: #d8d7d0;
  --banner: #0f0f0e; --logo: #ffffff;
  --accent: #2a7336; --accent-ink: #ffffff; --accent-soft: #e4f0df;
  /* Macros keep their own blue so they stand apart from regular keys. */
  --macro: #2f62e0; --macro-ink: #ffffff; --macro-soft: #eaeefa;
  --key: #f6f5f1; --key-top: #ffffff; --key-edge: #cfcec6; --key-shadow: #b3b2a9;
  --plate: #dedcd5; --plate-edge: #cbc9c1; --shadow: 40 38 30;
  --ok: #2a7336; --warn: #a24a00; --danger: #c22a2a; --status-green: #5fc26a;
  --sans: 'Archivo', 'Segoe UI', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  /* Corner radii: controls 4px, keycaps and menus 6px, panels and dialogs 10px; color swatches follow keycaps. */
  --r-sm: 4px; --r-md: 6px; --r-lg: 10px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111110; --panel: #1a1a18; --ink: #ecebe5; --muted: #9d9c94; --line: #2b2b28;
    --accent: #8fd17f; --accent-ink: #0e1a0c; --accent-soft: #1d2b1b;
    --macro: #7aa2ff; --macro-ink: #0d0d0f; --macro-soft: #1c2438;
    --key: #232321; --key-top: #2a2a27; --key-edge: #363632; --key-shadow: #070707;
    --plate: #0b0b0a; --plate-edge: #242422; --shadow: 0 0 0;
    --ok: #8fd17f; --warn: #f0a35e; --danger: #ff7272;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-gutter: stable; }
@supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-sm); padding: 6px 12px; transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease), transform 90ms var(--ease); }
button:hover:not(:disabled) { border-color: var(--accent); }
button:active:not(:disabled) { transform: translateY(1px); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
@media (prefers-reduced-motion: reduce) { button { transition: none; } button:active:not(:disabled) { transform: none; } }
.key-assignment { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; margin-bottom: 12px; }
.key-assignment select { width: 100%; min-width: 0; }
.key-assignment > .primary { white-space: nowrap; }
.capture-start { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.capture-start .ico { width: 17px; height: 17px; color: var(--accent); }
/* Capture panel: held keys appear as small keycaps; a caret waits in the empty slot for the main key. */
.capture-panel { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 10px 16px; margin-bottom: 14px; padding: 14px; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: var(--r-md); background: color-mix(in srgb, var(--accent-soft) 50%, var(--panel)); animation: rise-in 180ms var(--ease); }
.capture-combo { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; min-height: 41px; }
.capture-plus { color: var(--muted); font-weight: 600; }
.capture-cap { display: inline-grid; place-items: center; min-width: 46px; height: 38px; padding: 0 12px; border: 1px solid var(--key-edge); border-radius: var(--r-md); background: linear-gradient(var(--key-top), var(--key) 70%); box-shadow: 0 3px 0 var(--key-shadow); font-weight: 600; font-stretch: 112%; white-space: nowrap; animation: cap-in 150ms var(--ease); transition: transform 110ms var(--ease), box-shadow 110ms var(--ease); }
@keyframes cap-in { from { transform: translateY(3px); box-shadow: 0 0 0 var(--key-shadow); } }
.capture-cap.slot { min-width: 58px; border: 1px dashed color-mix(in srgb, var(--accent) 65%, var(--line)); background: transparent; box-shadow: none; animation: none; }
.capture-cap.slot::after { content: ''; width: 2px; height: 17px; border-radius: 1px; background: var(--accent); animation: caret 1.05s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.capture-cap.main { border-color: color-mix(in srgb, var(--key-edge) 30%, var(--accent)); color: var(--accent); }
.capture-panel.done .capture-cap { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow); }
.capture-note { grid-column: 1; margin: 0; color: var(--muted); font-size: 13px; max-width: 58ch; text-wrap: pretty; }
.capture-note.warn { color: var(--danger); }
.capture-cancel { grid-column: 2; grid-row: 1; }
/* Shakes a rejected key on both the panel and the keycap; uses translate so it composes with the lift. */
.capture-reject { animation: capture-shake 300ms var(--ease); }
@keyframes capture-shake { 20% { translate: -4px 0; } 40% { translate: 4px 0; } 60% { translate: -2px 0; } 80% { translate: 1px 0; } }
@media (prefers-reduced-motion: reduce) {
  .capture-panel, .capture-cap, .capture-reject { animation: none; transition: none; }
  .capture-cap.slot::after { animation: none; }
}
button.danger { color: var(--danger); }
select, input[type=number], input[type=text] { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 8px; transition: border-color 160ms var(--ease); }
select:hover:not(:disabled), input[type=number]:hover:not(:disabled), input[type=text]:hover:not(:disabled) { border-color: color-mix(in srgb, var(--line) 50%, var(--muted)); }
select:focus-visible, input[type=number]:focus-visible, input[type=text]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

header {
  color-scheme: dark;
  --bg: #111110; --panel: #1a1a18; --ink: #ecebe5; --muted: #9d9c94; --line: #2b2b28;
  --accent: #8fd17f; --accent-ink: #0e1a0c; --ok: #8fd17f; --warn: #f0a35e;
  display: flex; align-items: center; gap: 16px; padding: 14px 24px;
  border-bottom: 1px solid var(--line); background: var(--banner); color: var(--ink);
}
header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
header h1.logo { line-height: 0; }
header h1.logo svg { height: 40px; width: auto; display: block; color: var(--logo); }
header .spacer { flex: 1; }
.connection-info { display: inline-flex; align-items: center; gap: 8px; }
.connection-info .pill { padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); white-space: nowrap; }
.settings-trigger { display: grid; place-items: center; width: 34px; height: 34px; padding: 7px; flex: none; color: var(--muted); background: transparent; }
.settings-trigger:hover { color: var(--ink); }
.settings-trigger svg { width: 19px; height: 19px; }
.theme-switch { display: inline-flex; gap: 2px; flex: none; padding: 2px; border: 1px solid var(--line); border-radius: var(--r-md); }
.theme-switch button { display: grid; place-items: center; width: 32px; height: 32px; padding: 6px; border: 1px solid transparent; border-radius: var(--r-sm); background: transparent; color: var(--muted); }
.theme-switch button[aria-pressed="true"] { background: var(--panel); border-color: var(--line); color: var(--ink); }
.theme-switch button:hover { color: var(--ink); }
.theme-switch svg { width: 18px; height: 18px; }
@media (max-width: 760px) {
  header { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
  header h1.logo { flex: 1 1 calc(100% - 90px); order: -2; }
  header h1.logo svg { max-width: 100%; height: auto; width: 280px; }
  header .theme-switch { order: -1; }
  header .spacer { display: none; }
}
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-sm); background: var(--bg); color: var(--muted); font-size: 13px; }
.pill .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--muted); }
.pill.on .dot { background: var(--status-green); }
.pill.sleep .dot { background: var(--warn); }

main { display: grid; grid-template-columns: 480px minmax(340px, 1fr); align-items: start; gap: 28px; padding: 28px 24px 40px; max-width: 1200px; margin: 0 auto; }
main > .card:first-child { position: sticky; top: 24px; }
@media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } main > .card:first-child { position: static; } }
.card { background: var(--panel); border-radius: var(--r-lg); padding: 20px 22px 24px; }
/* The numpad sits on a plate shaped like the device body, the only raised surface on the page. */
main > .card:first-child { background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 18px; padding: 18px 18px 22px; box-shadow: inset 0 1px 0 rgb(255 255 255 / .06), 0 18px 40px -24px rgb(var(--shadow) / .55); }
.advanced-popup { width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); margin: auto; padding: 22px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); color: var(--ink); box-shadow: 0 24px 60px -12px rgb(var(--shadow) / .45); }
.advanced-popup[open] { animation: rise-in 200ms var(--ease); }
@keyframes rise-in { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@media (prefers-reduced-motion: reduce) { .advanced-popup[open] { animation: none; } }
.advanced-popup::backdrop { background: rgb(var(--shadow) / .45); backdrop-filter: blur(3px); }
.advanced-popup-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.advanced-popup-head h2 { margin: 0; font-size: 18px; font-stretch: 125%; font-weight: 800; letter-spacing: -.01em; }
.advanced-close { display: grid; place-items: center; width: 30px; height: 30px; padding: 5px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--muted); }
.advanced-close:hover { color: var(--ink); background: var(--bg); }
.advanced-close svg { width: 18px; height: 18px; }
.advanced-body { padding-top: 18px; }
.advanced-intro { margin: 0 0 18px; }
.advanced-controls { border: 0; padding: 0; margin: 0; min-width: 0; }
.advanced-controls h3 { margin: 0; font-size: 14px; }
.advanced-debounce { margin-top: 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 10px; }
.advanced-debounce input { width: 100%; min-width: 0; accent-color: var(--accent); }
.advanced-debounce output { min-width: 32px; padding: 3px 8px; text-align: center; background: var(--accent-soft); color: var(--accent); border-radius: var(--r-sm); font-family: var(--mono); font-size: 13px; }
.advanced-sleep { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.advanced-sleep > .hint { margin: 5px 0 14px; }
.advanced-setting { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 12px 0; }
.advanced-setting > span:first-child { flex: 1; }
.advanced-setting strong, .advanced-setting small { display: block; }
.advanced-setting strong { font-weight: 500; }
.advanced-setting small { color: var(--muted); margin-top: 2px; }

.macro-remove:hover:not(:disabled) { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--panel)); }
.macro-remove .ico { width: 14px; height: 14px; }
.macro-list tfoot td { border-top: 1px solid var(--line); border-bottom: 0; color: var(--muted); font-size: 12px; }
@media (max-width: 1100px) and (min-width: 1001px), (max-width: 540px) {
  .macro-sequence.expanded .macro-list { overflow-x: auto; }
}
.rec { color: var(--danger); font-weight: 600; }
.reset-all { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); }
.reset-all .group-title { margin: 0 0 2px; }
.reset-all .hint { margin: 0; max-width: 46ch; }
.reset-all button { flex: none; white-space: nowrap; }
button.primary.danger { background: var(--danger); border-color: var(--danger); color: var(--panel); }
button.primary.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 86%, var(--ink)); }
.confirm-popup { width: min(420px, calc(100vw - 32px)); }
.confirm-text { margin: 14px 0 22px; color: var(--muted); text-wrap: pretty; }
.confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
.bytes { font-size: 12px; color: var(--muted); }

#log { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; max-width: 380px; z-index: 10; }
.toast { --tone: var(--muted); display: flex; align-items: baseline; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; box-shadow: 0 14px 30px -12px rgb(var(--shadow) / .45); animation: rise-in 220ms var(--ease); }
.toast::before { content: ''; flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--tone); transform: translateY(-1px); }
.toast.err { --tone: var(--danger); }
.toast.ok { --tone: var(--ok); }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
.busy { position: fixed; inset: 0; background: rgb(var(--shadow) / .25); display: none; align-items: center; justify-content: center; z-index: 9; }
/* Blocks input at once but only fades in for slow writes, so quick saves never flash the overlay. */
.busy.show { display: flex; cursor: progress; animation: busy-appear 160ms 280ms both; }
@keyframes busy-appear { from { opacity: 0; } }
.busy div { display: flex; align-items: center; gap: 12px; background: var(--panel); padding: 16px 22px; border-radius: var(--r-lg); border: 1px solid var(--line); box-shadow: 0 24px 50px -16px rgb(var(--shadow) / .5); font-weight: 500; }
.busy div::before { content: ''; flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); animation: busy-pulse 1s ease-in-out infinite; }
@keyframes busy-pulse { 50% { opacity: .25; transform: scale(.7); } }
@media (prefers-reduced-motion: reduce) { .busy div::before { animation: none; } }
.unsupported { max-width: 640px; margin: 80px auto; }
.layers .light-tab { display: inline-flex; align-items: center; gap: 6px; }
.layers .light-tab .ico { width: 16px; height: 16px; }
.grid-btns button.sel, .seg button.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.row > .slider-label { width: 84px; color: var(--muted); }
.slider input[type=range] { flex: 1; max-width: 260px; accent-color: var(--accent); }
.slider-val { width: 40px; color: var(--muted); font-size: 13px; }
.swatches { display: grid; grid-template-columns: max-content 1px minmax(0, 1fr); align-items: start; gap: 12px; margin-bottom: 14px; }
.default-swatches { display: grid; grid-template-columns: repeat(8, 30px); gap: 8px; }
.custom-swatches { display: flex; flex-wrap: wrap; align-items: center; align-content: start; gap: 8px; min-width: 0; }
.swatch { width: 30px; height: 30px; padding: 0; border-radius: var(--r-md); border: 1px solid rgb(var(--shadow) / .25); box-shadow: inset 0 -3px 0 rgb(0 0 0 / .18); flex: none; }
.swatch.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.swatch.off { background: repeating-linear-gradient(45deg, var(--panel) 0 4px, var(--line) 4px 8px) !important; }
.swatch-divider { width: 1px; min-height: 30px; height: 100%; background: var(--line); }
.saved-color-wrap { display: inline-flex; position: relative; width: 30px; height: 30px; flex: none; }
.delete-color { position: absolute; right: -6px; bottom: -5px; display: grid; place-items: center; width: 18px; height: 18px; padding: 2px; border-radius: var(--r-sm); background: var(--panel); color: var(--danger); }
.delete-color:hover:not(:disabled) { border-color: var(--danger); }
.delete-color .ico { width: 12px; height: 12px; }
.save-color { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 1px dashed var(--muted); border-radius: var(--r-md); background: transparent; color: var(--muted); }
.save-color:hover:not(:disabled) { color: var(--accent); }
.save-color .ico { width: 16px; height: 16px; }
@media (max-width: 520px) {
  .default-swatches { grid-template-columns: repeat(8, 26px); gap: 6px; }
  .default-swatches .swatch { width: 26px; height: 26px; }
}
.color-editor { position: fixed; z-index: 20; width: 280px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow: auto; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); color: var(--ink); box-shadow: 0 18px 40px -10px rgb(var(--shadow) / .4); opacity: 0; transform: scale(.84); }
.color-editor.open { animation: color-grow 220ms cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes color-grow { from { opacity: 0; transform: scale(.84); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .color-editor.open { animation-duration: 1ms; } }
.color-editor-head, .color-editor-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.color-editor-head { margin-bottom: 12px; }
.color-editor-head strong { font-size: 14px; font-weight: 600; }
.color-editor-close { display: grid; place-items: center; width: 26px; height: 26px; padding: 4px; border: none; background: transparent; color: var(--muted); }
.color-editor-close:hover { color: var(--ink); }
.color-editor-close .ico { width: 16px; height: 16px; }
.color-plane { position: relative; height: 148px; border-radius: var(--r-md); background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(var(--hue) 100% 50%)); touch-action: none; cursor: crosshair; }
.color-plane:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.color-point { position: absolute; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px rgb(0 0 0 / .5); transform: translate(-50%, -50%); pointer-events: none; }
.color-hue { display: block; appearance: none; width: 100%; height: 12px; margin: 16px 0; border-radius: 999px; background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); cursor: pointer; }
.color-hue::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; border: 2px solid var(--panel); border-radius: 50%; background: hsl(var(--hue) 100% 50%); box-shadow: 0 0 0 1px var(--muted); }
.color-hex { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
.color-hex input { flex: 1; min-width: 0; font: 13px var(--mono); }
.color-hex input[aria-invalid="true"] { border-color: var(--danger); }
.color-editor-delete { display: inline-flex; align-items: center; gap: 5px; padding: 5px 0; border: none; background: transparent; color: var(--danger); }
.color-editor-delete .ico { width: 16px; height: 16px; }
.key.paint { box-shadow: 0 2px 0 var(--key-shadow), inset 0 0 0 1px rgb(0 0 0 / .15); }
.key.paint .legend { color: inherit; opacity: .75; }
.key.paint.unlit { background: var(--key) !important; color: var(--muted) !important; }
.key.rainbow::before { content: ''; position: absolute; inset: 0; border-radius: 8px; padding: 2px; background: linear-gradient(135deg, #f44, #fb0, #4d4, #2cf, #66f, #e4e); mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude; pointer-events: none; }
.knob.dim { opacity: .45; }
.button-like { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-sm); padding: 6px 12px; }
.button-like:hover { border-color: var(--accent); }
.image-actions { position: relative; }
.image-export { display: inline-flex; align-items: center; gap: 4px; }
.image-help summary { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-sm); color: var(--muted); cursor: pointer; list-style: none; }
.image-help summary::-webkit-details-marker { display: none; }
.image-help summary:hover, .image-help[open] summary { color: var(--accent); background: var(--accent-soft); }
.image-help summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.image-help .ico { width: 18px; height: 18px; }
.image-help-text { position: absolute; z-index: 5; top: calc(100% + 8px); left: 0; width: min(360px, 100%); margin: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); color: var(--ink); font-size: 13px; line-height: 1.55; box-shadow: 0 12px 28px -8px rgb(var(--shadow) / .3); }
</style>
</head>

function parseLight(r) {
  const low = r[4] & 15;
  let rgb = (r[5] << 16) | (r[6] << 8) | r[7];
  if (low <= 6) rgb = PRESET_COLORS[low];
  if (rgb === WHITE_AS_SENT) rgb = 0xffffff;
  const blackStatic = r[1] === 1 && low === 7 && rgb === 0;
  return { mode: blackStatic ? 0 : r[1], speed: Math.min(4, Math.max(0, 4 - r[2])), bright: blackStatic ? 0 : Math.min(4, r[3]), option: r[4] >> 4, rainbow: low === 8, rgb };
}
// [07, mode, 4 - speed, brightness, option<<4 | color kind, r, g, b]; checksum goes in byte 8.
function lightFrame(l) {

  // keep the renderer running at nonzero brightness so it clears every LED.
  if (l.mode === 0) return [0x07, 1, 4 - l.speed, 4, 7, 0, 0, 0];
  if (l.mode === CUSTOM_MODE) return [0x07, l.mode, 4 - l.speed, l.bright, l.option << 4, 0, 200, 200];
  const rgb = l.rgb === 0xffffff ? WHITE_AS_SENT : l.rgb;

const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v; else if (k === 'style') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (v !== undefined && v !== false) el[k] = v;
  }

async function connect(device) {
  if (!device.opened) await device.open();
  state.kb = new AL21(device);
  const ok = await busy('Reading the numpad…', async () => {
    let st = await state.kb.status();
    if (!st.online) {
      $('busyText').textContent = 'The numpad is asleep. Press any key on it…';
      for (let i = 0; i < 600 && !st.online; i++) { await sleep(100); st = await state.kb.status(); }
      if (!st.online) throw new Error('The numpad stayed asleep. Press a key on it, then click Reload.');
    }
    const id = await state.kb.deviceId();
    if (id !== AL21_ID) throw new Error(`This receiver is paired with device ${id}, not an AL21 (${AL21_ID}). Nothing was changed.`);
    await loadAll();
    return true;
  });
  if (!ok) { state.kb = null; state.maps = {}; render(); return; }
  $('reload').disabled = false;
  $('connect').hidden = true;
  pollStatus();
}

  await flushLight();

  for (const l of layers()) {

// Writes
// ---------------------------------------------------------------------------
async function writeSlot(layer, slot, value) {
  const name = ALL_KEYS.find((k) => k.slot === slot);
  const current = slotValue(layer, slot);
  if (layer !== 'fn' && eq(current, [10, 1, 0, 0]) && !eq(value, current)) {
    const fnCount = Array.from({ length: 64 }, (_, s) => slotValue(layer, s)).filter((v) => eq(v, [10, 1, 0, 0])).length;
    if (fnCount <= 1 && !confirm('This is the only Fn key in this profile. Without it you cannot reach the Fn layer (profile, backlight and connection shortcuts). Continue?')) return false;
  }
  await state.kb.writeKey(layer, slot, value);
  const page = Math.floor(slot / 16);
  const data = layer === 'fn' ? await state.kb.readFnPage(page) : await state.kb.readKeyPage(layer, page);
  state.maps[layer].set(data, page * 64);
  if (!eq(slotValue(layer, slot), value)) throw new Error(`The numpad did not store the change for ${name?.legend ?? 'slot ' + slot}.`);
  return true;
}
// Writes show optimistically: the keycap takes the new value at once and plays its confirmation
// while the numpad is written behind it. Only a failed or cancelled write puts the old value back.
// state.maps keeps holding what the numpad confirmed, so writeSlot's checks stay real.
// Several writes can be in flight at once (the device queue serializes them), so values,
// confirmations and shakes are tracked per slot.
const pending = new Map(); // `${layer}:${slot}` → the value being written
const slotKey = (layer, slot) => `${layer}:${slot}`;
const shownValue = (layer, slot) => pending.get(slotKey(layer, slot)) ?? slotValue(layer, slot);
// The confirmation continues across re-renders until its longest part (the label) has finished.
const SET_ANIMATION_MS = 1100, SHAKE_MS = 300;
let flashes = [], reverted = []; // [{ layer, slots, tone, at }] and [{ layer, slots, at }]
async function writeShown(layer, values, write) {
  const slots = [...values.keys()];
  for (const [slot, value] of values) pending.set(slotKey(layer, slot), value);
  const flash = { layer, slots, tone: slots.every((s) => eq(values.get(s), defaultFor(layer, s))) ? 'reset' : '', at: performance.now() };
  flashes.push(flash);
  render();
  let ok = false;
  try {
    ok = await write();
  } finally {
    // A newer write to the same slot keeps its own pending value.
    for (const [slot, value] of values) if (pending.get(slotKey(layer, slot)) === value) pending.delete(slotKey(layer, slot));
    if (!ok) flashes = flashes.filter((f) => f !== flash);
    // Shake whatever the numpad did not end up storing; those keys show their old value again.
    const lost = slots.filter((s) => !pending.has(slotKey(layer, s)) && !eq(slotValue(layer, s), values.get(s)));
    if (lost.length) reverted.push({ layer, slots: lost, at: performance.now() });
    render();
  }
  return ok;
}
// Key, Media and Mouse changes save quietly behind the optimistic keycap; the other tabs keep the
// blocking "Saving" overlay. Quiet errors still show as a toast.
function assign(value, { quiet = false } = {}) {
  const { layer, sel } = state;
  state.keyDraft = null;
  const save = () => writeShown(layer, new Map([[sel.slot, value]]), async () => {
    const ok = await writeSlot(layer, sel.slot, value);
    if (ok) toast(`${keyTitle(sel)} → ${labelOf(value, layer)}`, 'ok');
    return ok;
  });
  if (!quiet) return busy('Saving to the numpad…', save);
  return save().catch((e) => { toast(e.message || String(e), 'err'); console.error(e); });
}
// Writes several slots, then reads back every touched page so state.maps matches the numpad
// even when a write fails halfway.
async function writeSlots(layer, values) {
  const pages = new Set();
  try {
    for (const [slot, value] of values) {
      pages.add(Math.floor(slot / 16));
      await state.kb.writeKey(layer, slot, value);
    }
  } finally {
    for (const page of pages) state.maps[layer].set(layer === 'fn' ? await state.kb.readFnPage(page) : await state.kb.readKeyPage(layer, page), page * 64);
  }
  const missed = [...values].filter(([slot, value]) => !eq(slotValue(layer, slot), value)).length;
  if (missed) throw new Error(`The numpad did not store ${missed} of the ${values.size} changes.`);
  return true;
}

  if (!values.size) return;

  state.keyDraft = null; state.macroDraft = null;

    await writeSlots(layer, values);
    toast(`${where[0].toUpperCase()}${where.slice(1)} is back to factory defaults.`, 'ok');
    return true;

      onclose: () => finish(false) },
      h('div', { class: 'advanced-popup-head' }, h('h2', {}, title)),

      h('div', { class: 'confirm-actions' },

function knobSelection() {
  const index = KNOB.indexOf(state.sel);
  // Trace each third along the rim and its dividers. The viewBox spans the knob's 108px face, so one
  // unit is about 1px: lines sit half a 2px stroke inside each edge, and the middle and right thirds
  // also clear the 1px divider line their button starts with.

  const cut = (x) => Math.sqrt(radius ** 2 - (x - 50) ** 2);
  const left = 100 / 3 - half, right = 200 / 3 + divider + half;
  const middleLeft = 100 / 3 + divider + half, middleRight = 200 / 3 - half;

    `M ${left} ${50 - cut(left)} A ${radius} ${radius} 0 0 0 ${left} ${50 + cut(left)} Z`,
    `M ${middleLeft} ${50 - cut(middleLeft)} A ${radius} ${radius} 0 0 1 ${middleRight} ${50 - cut(middleRight)} L ${middleRight} ${50 + cut(middleRight)} A ${radius} ${radius} 0 0 1 ${middleLeft} ${50 + cut(middleLeft)} Z`,
    `M ${right} ${50 - cut(right)} A ${radius} ${radius} 0 0 1 ${right} ${50 + cut(right)} Z`,
  ];
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('class', 'knob-selection');
  svg.setAttribute('aria-hidden', 'true');
  paths.forEach((d, i) => {
    const path = document.createElementNS(svg.namespaceURI, 'path');
    path.setAttribute('d', d);
    if (i === index) path.setAttribute('class', 'sel');
    svg.append(path);

    svg.append(sweep);

}

    if (e.repeat) { e.preventDefault(); return; }
    const k = KEY_BY_CODE.get(e.code);
    if (!k) return;
    e.preventDefault();
    const now = performance.now();
    if (last) last.delay = Math.max(0, Math.min(65535, Math.round(now - last.t)));
    last = { code: k.hid, down: e.type === 'keydown', delay: 0, t: now };
    d.events.push(last);
    renderEditor();
  };
  window.addEventListener('keydown', recording, true);
  window.addEventListener('keyup', recording, true);
  renderEditor();
}
function saveMacro() {
  const d = state.macroDraft;
  if (recording) toggleRecord();
  const used = usedMacroSlots();
  let slot = d.slot;
  if (slot == null) {
    // New macro: take the lowest slot no key references (same rule as the official driver).
    slot =[...Array(MACRO_SLOTS).keys()].find((s) => !used.has(s));
    if (slot == null) return toast('All 50 macro slots are in use.', 'err');
  }
  const buf = (() => { try { return encodeMacro(d.events, d.mode === 0 ? d.repeat : 1, d.startDelay || 0); } catch (e) { toast(e.message, 'err'); } })();
  if (!buf) return;
  const value = [9, d.mode, slot, 0];
  return busy('Saving macro…', () => writeShown(state.layer, new Map([[state.sel.slot, value]]), async () => {
    await state.kb.writeMacro(slot, buf);
    const back = await state.kb.readMacro(slot);
    const n = macroLength(d.events, d.startDelay);
    if (!eq(back.slice(0, n), buf.slice(0, n))) throw new Error('The numpad did not store the macro correctly.');
    const names = macroNames();
    names[slot] = d.name.trim() || names[slot] || `Macro ${slot + 1}`;
    store.set('al21.macroNames', names);
    const ok = await writeSlot(state.layer, state.sel.slot, value);
    if (ok) toast(`${keyTitle(state.sel)} → ${macroName(slot)}`, 'ok');
    state.macroDraft = null;
    return ok;
  }));
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
const advancedDialog = $('advanced');
$('advancedOpen').onclick = () => {
  if (capturing) stopKeyCapture();
  if (recording) toggleRecord();
  closeColorEditor(false);
  renderAdvancedSettings();
  if (!advancedDialog.open) advancedDialog.showModal();
};
$('advancedClose').onclick = () => advancedDialog.close();
const outsideAdvancedDialog = ev => {
  const rect = advancedDialog.getBoundingClientRect();
  return ev.target === advancedDialog && (ev.clientX < rect.left || ev.clientX > rect.right || ev.clientY < rect.top || ev.clientY > rect.bottom);
};
let advancedBackdropPressed = false;
advancedDialog.addEventListener('pointerdown', ev => { advancedBackdropPressed = outsideAdvancedDialog(ev); });
advancedDialog.addEventListener('click', ev => {
  if (advancedBackdropPressed && outsideAdvancedDialog(ev)) advancedDialog.close();
  advancedBackdropPressed = false;
});
if (!('hid' in navigator)) {
  $('app').replaceChildren(h('div', { class: 'card unsupported' },
    h('h2', {}, 'This browser cannot talk to USB devices'),
    h('p', {}, 'Open AL21 Studio in Google Chrome or Microsoft Edge. If you opened the file directly, run "node serve.js" in this folder and visit the address it prints.')));
  $('connect').disabled = true;
} else {
  const stopRecordingForSettings = () => {
    if (capturing) stopKeyCapture();
    if (recording) toggleRecord();
  };
  $('advanced').addEventListener('pointerdown', stopRecordingForSettings);
  $('advanced').addEventListener('focusin', stopRecordingForSettings);
  $('connect').onclick = async () => {
    try {
      const picked = await navigator.hid.requestDevice({ filters: FILTERS });
      const dev = picked.find(isVendorIface);
      if (dev) await connect(dev);
    } catch (e) { toast(e.message, 'err'); }
  };
  $('reload').onclick = () => busy('Reading the numpad…', loadAll);
  navigator.hid.getDevices().then((ds) => { const d = ds.find(isVendorIface); if (d) connect(d).catch((e) => toast(e.message, 'err')); });
  render();
}
</script>
